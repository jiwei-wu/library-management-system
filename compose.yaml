services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: library
      MYSQL_USER: library
      MYSQL_PASSWORD: local_library_password
      MYSQL_ROOT_PASSWORD: local_root_password
    ports:
      - "3306:3306"
    volumes:
      - library_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u library -plocal_library_password"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  library_mysql:
